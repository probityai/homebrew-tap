name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request supersedes the older run; merge-queue
  # batches and pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path selection. The formula matrix (eight jobs, half on macOS) runs unless
  # every changed file is documentation or the README lint. Any other path, a
  # workflow change, a push to main, a merge-queue batch or a manual run
  # selects it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      formula: ${{ steps.select.outputs.formula }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "formula=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD) || { echo "formula=true" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "$changed"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^(README\.md|[^/]*\.md|docs/.*|scripts/readme-lint\.py)$'; then
            echo "formula=false" >> "$GITHUB_OUTPUT"
          else
            echo "formula=true" >> "$GITHUB_OUTPUT"
          fi

  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/readme-lint.py README.md
      - run: python3 -m unittest discover -s scripts/tests -v
      - uses: probityai/.github/actions/version-pins@389f391daa3001be6a5d896879bda3d69f1f781e # main
        with:
          command: check

  formula:
    needs: changes
    if: needs.changes.outputs.formula == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        formula:
          - agent-evidence-admission
          - agent-evidence-observer
          - agent-evidence-vectors
          - probity-verify
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - id: brew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # main
      - run: brew style probityai/tap/${{ matrix.formula }}
      - run: brew audit --strict probityai/tap/${{ matrix.formula }}
      - run: brew install --build-from-source --verbose probityai/tap/${{ matrix.formula }}
      - run: brew test --verbose probityai/tap/${{ matrix.formula }}

  # The one status the main ruleset requires. It runs even when a job fails or
  # is skipped, and passes only when every job it needs passed or was skipped
  # by path selection.
  ci-ok:
    if: always()
    needs: [changes, readme, formula]
    runs-on: ubuntu-latest
    steps:
      - name: Every selected job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a required job ended $r"; exit 1 ;;
            esac
          done
