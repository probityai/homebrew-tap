name: pin-refresh

# Moves the family lock in version-pins.toml, the README rows and each formula (url,
# sha256, resource blocks) to the newest PyPI releases as a pull request, runs ci.yml
# on it (brew audit and brew test on Linux and macOS) and merges it when every run is
# green. The hourly run is the path: a release reaches the tap within an hour, inside
# the one-day grace registry-verify allows.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "why it runs now"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: brew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # main
      - uses: probityai/.github/actions/pin-refresh@449849e49f23d5c9a3e2422bb8366aac738dd076 # main
        with:
          ci: ci.yml
          formulas: "true"
          tap: probityai/tap
          app-client-id: ${{ vars.PIN_REFRESH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PIN_REFRESH_APP_PRIVATE_KEY }}
