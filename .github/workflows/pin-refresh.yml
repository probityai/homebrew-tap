name: pin-refresh

# Moves the family lock in version-pins.toml, the README rows and each formula (url,
# sha256, resource blocks) to the newest PyPI releases as a pull request, runs ci.yml
# on it (brew audit and brew test on Linux and macOS) and merges it when every run is
# green. The hourly run is the path: a release reaches the tap within an hour, inside
# the one-day grace registry-verify allows.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "why it runs now"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: brew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # main
      - uses: probityai/.github/actions/pin-refresh@389f391daa3001be6a5d896879bda3d69f1f781e # main
        with:
          ci: ci.yml
          formulas: "true"
          tap: probityai/tap
          token: ${{ github.token }}
