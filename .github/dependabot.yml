version: 2

# One weekly pull request moves every action pin together. github/codeql-action's init,
# analyze and upload-sarif must stay at one version: analyze refuses a database another
# version wrote. The formulas are moved by pin-refresh.yml, not by Dependabot, which has
# no Homebrew ecosystem.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
