# The versions this tap's formulas and README name. Every package is released by another
# repository, so each is a family lock line; the pin-refresh workflow moves a lock, the
# formula (url, sha256, resources) and the README together when the registry has a newer
# release, runs the formula CI and merges the result.
repository = "probityai/homebrew-tap"

[family]
"pypi:probity-verify" = "0.4.0"
"pypi:agent-evidence-vectors" = "0.33.0"
"pypi:agent-evidence-admission" = "0.2.0"
"pypi:agent-evidence-observer" = "0.1.3"

[scan]
include = ["README.md", "Formula/*.rb"]

[refresh]
settle_hours = 25
